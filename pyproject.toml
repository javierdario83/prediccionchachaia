[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prediccionchachaia"
version = "0.1.0"
description = "MVP autonomo de prediccion de futbol con datos publicos de football-data.co.uk"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
    "streamlit>=1.32",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["football_predictor*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
